name: Build iOS CarPlay IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Smart EV Dashboard iOS (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Xcode Project with DerivedData
        run: |
          cd ios_app/SmartEVDashboard
          xcodebuild build \
                     -project SmartEVDashboard.xcodeproj \
                     -scheme SmartEVDashboard \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath "${{ github.workspace }}/DerivedData" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .app into .ipa File
        run: |
          echo "=== Locating Built .app ==="
          APP_PATH="${{ github.workspace }}/DerivedData/Build/Products/Release-iphoneos/SmartEVDashboard.app"
          echo "Checking app at: $APP_PATH"
          ls -la "$APP_PATH"
          
          mkdir -p "${{ github.workspace }}/Payload"
          cp -R "$APP_PATH" "${{ github.workspace }}/Payload/"
          cd "${{ github.workspace }}"
          zip -r SmartEVDashboard.ipa Payload
          ls -lh SmartEVDashboard.ipa
          echo "✅ Đã tạo xong file SmartEVDashboard.ipa chuẩn!"

      - name: Upload .ipa Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SmartEVDashboard-iOS-IPA
          path: SmartEVDashboard.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "SmartEV Dashboard iOS Release v1.0.0"
          body: "SmartEV Dashboard for iOS & Apple CarPlay (R-Speedo Style, ANT BMS 32-Cell Monitor, Votol 4-Page Tuner, Dragger 0-60 Timer)."
          files: SmartEVDashboard.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
