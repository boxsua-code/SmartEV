name: Build iOS CarPlay IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Smart EV Dashboard iOS (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Xcode Project for iOS
        run: |
          cd ios_app/SmartEVDashboard
          xcodebuild build \
                     -project SmartEVDashboard.xcodeproj \
                     -autocreateSchemes \
                     -scheme SmartEVDashboard \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -destination 'generic/platform=iOS Simulator' \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     BUILD_DIR=../../build

      - name: Package .app into .ipa File
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphonesimulator/SmartEVDashboard.app build/Payload/
          cd build
          zip -r SmartEVDashboard.ipa Payload
          echo "✅ Đã tạo xong file SmartEVDashboard.ipa!"

      - name: Upload .ipa Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SmartEVDashboard-iOS-IPA
          path: build/SmartEVDashboard.ipa
          retention-days: 30
